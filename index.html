<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proji KazFerroGroup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: dark graphite control-room sidebar + light working area; state shown by pills and severity stripes */
:root{
  --bg:#eef0f3;--surface:#ffffff;--surface2:#f6f7f9;--ink:#141a22;--muted:#5b6574;--line:#d9dde3;
  --accent:#1d5bd8;--accent-ink:#ffffff;--accent-soft:#e4ecfc;
  --side:#141920;--side-ink:#c9d1dc;--side-muted:#7c8796;--side-active:#252e3a;--molten:#ec7a12;
  --ok:#1c7d47;--ok-soft:#dff3e7;--warn:#975f00;--warn-soft:#fbefd6;--crit:#bf3329;--crit-soft:#fbe3e1;
  --info:#1d5bd8;--info-soft:#e4ecfc;--off:#5b6574;--off-soft:#e6e8ec;--water:#a8c6dd;--green:#9fc79a;
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1217;--surface:#161b22;--surface2:#1b2129;--ink:#e5e9ef;--muted:#95a0ae;--line:#2a323d;
  --accent:#6f9cff;--accent-ink:#0b1220;--accent-soft:#1c2a47;
  --side:#0a0d11;--side-ink:#c9d1dc;--side-muted:#6f7a89;--side-active:#1c232d;--molten:#ff8a2a;
  --ok:#5fd394;--ok-soft:#14301f;--warn:#f0b54a;--warn-soft:#352812;--crit:#ff7a6e;--crit-soft:#3b1a17;
  --info:#6f9cff;--info-soft:#1c2a47;--off:#95a0ae;--off-soft:#232a33;--water:#1d3a52;--green:#2c4a33;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217;--surface:#161b22;--surface2:#1b2129;--ink:#e5e9ef;--muted:#95a0ae;--line:#2a323d;
  --accent:#6f9cff;--accent-ink:#0b1220;--accent-soft:#1c2a47;
  --side:#0a0d11;--side-ink:#c9d1dc;--side-muted:#6f7a89;--side-active:#1c232d;--molten:#ff8a2a;
  --ok:#5fd394;--ok-soft:#14301f;--warn:#f0b54a;--warn-soft:#352812;--crit:#ff7a6e;--crit-soft:#3b1a17;
  --info:#6f9cff;--info-soft:#1c2a47;--off:#95a0ae;--off-soft:#232a33;--water:#1d3a52;--green:#2c4a33;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:20px 12px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:radial-gradient(circle at 35% 35%,#ffd08a,var(--molten) 55%,#7a2a00);flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.02em;color:#fff}
.brand small{display:block;font-size:11px;color:var(--side-muted);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:14px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup>span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:0 10px 4px}
.navbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;color:var(--side-ink);padding:7px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:13.5px}
.navbtn:hover{background:var(--side-active)}
.navbtn.on{background:var(--side-active);color:#fff;box-shadow:inset 2px 0 0 var(--molten)}
.badge{font-family:var(--f-mono);font-size:11px;background:#bf3329;color:#fff;border-radius:10px;padding:0 6px;line-height:18px}
.sidefoot{margin-top:auto;font-size:11.5px;color:var(--side-muted);padding:0 10px;display:flex;flex-direction:column;gap:6px}
.sidefoot button{background:none;border:1px solid #333c48;color:var(--side-ink);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px}
main{padding-inline:28px;padding-block:22px 48px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0;letter-spacing:-.005em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
h3{font-size:13px;font-weight:600;margin:0 0 8px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile .n{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.2}
.tile.crit .n{color:var(--crit)}.tile.warn .n{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:10px;white-space:nowrap;background:var(--off-soft);color:var(--off)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--info-soft);color:var(--info)}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{min-width:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 11px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
form.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
form.f .wide{grid-column:1/-1}
.err{color:var(--crit);font-size:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.colh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.card.p-crit{border-left-color:var(--crit)}.card.p-high{border-left-color:var(--warn)}
.card .t{font-size:13px;font-weight:500;line-height:1.35}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.blk{background:var(--warn-soft);color:var(--warn);font-size:11.5px;padding:4px 7px;border-radius:4px}
.late{color:var(--crit);font-weight:600}
.card select{font-size:11.5px;padding:2px 4px}
/* equipment */
.eq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.eq:hover{border-color:var(--accent)}
.eq .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(640px,100%);height:100%;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
/* stages */
.stages{display:flex;gap:3px;align-items:center}
.stages i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.stages i.d{background:var(--accent)}.stages i.c{background:var(--molten)}
.chain{display:grid;grid-template-columns:repeat(8,minmax(92px,1fr));gap:6px;overflow-x:auto}
.chain div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;font-size:12px}
.chain b{display:block;font-family:var(--f-mono);font-size:18px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.score{display:flex;align-items:center;gap:8px}
.score .bar{flex:1;min-width:60px}
.s5{text-align:center;font-family:var(--f-mono);font-weight:600}
.lv1,.lv2{background:var(--crit-soft);color:var(--crit)}.lv3{background:var(--warn-soft);color:var(--warn)}.lv4,.lv5{background:var(--ok-soft);color:var(--ok)}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-child{border-top:0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none}
summary::-webkit-details-marker{display:none}
.doc{white-space:pre-wrap;font-size:13px;margin:8px 0 0;color:var(--ink);max-width:70ch}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow-y:auto;padding:4px}
.msg{max-width:min(720px,92%);padding:10px 13px;border-radius:10px;font-size:13.5px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.a ul{margin:4px 0 0;padding-left:18px}
.twinq{display:flex;flex-direction:column;gap:6px}
.twinq h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:8px 10px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:30}
.s3d{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start}
#scene{position:relative;height:min(74vh,700px);min-height:420px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--bg)}
#scene canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene canvas:active{cursor:grabbing}
.labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.l3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:var(--f-mono);font-size:11px;white-space:nowrap;pointer-events:auto;cursor:pointer;display:flex;gap:5px;align-items:center;color:var(--ink)}
.l3d.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.l3d i{width:7px;height:7px;border-radius:50%;flex:none}
.l3d.zone{background:none;border:0;color:var(--muted);font-family:var(--f-body);text-transform:uppercase;letter-spacing:.07em;font-size:10px;font-weight:600;pointer-events:none;transform:translate(-50%,-50%)}
.hint3d{position:absolute;left:10px;bottom:10px;font-size:11.5px;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:5px;border:1px solid var(--line);pointer-events:none}
.side3d{display:flex;flex-direction:column;gap:14px;min-width:0}
.eqrow{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:7px 2px;cursor:pointer;text-align:left}
.eqrow:first-child{border-top:0}.eqrow:hover{background:var(--surface2)}.eqrow.on{background:var(--accent-soft)}
@media (max-width:860px){
  .s3d{grid-template-columns:minmax(0,1fr)}
  #scene{height:60vh}
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;padding:12px 16px;gap:10px}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  .navgroup{flex-direction:row;gap:4px}.navgroup>span{display:none}
  .navbtn{white-space:nowrap}
  .sidefoot{display:none}
  main{padding-inline:16px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand"><div class="mark"></div><div><b>Proji</b><small>KazFerroGroup</small></div></div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <span id="clock"></span>
      <span>Прототип. Изменения сохраняются в этом браузере.</span>
      <button data-a="reset">Сбросить демо-данные</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="drawer"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- utils ----------
const DAY=864e5,pad=n=>String(n).padStart(2,'0');
const T0=new Date();T0.setHours(0,0,0,0);
const ds=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
const d=n=>ds(new Date(T0.getTime()+n*DAY));
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const diff=s=>Math.round((parse(s)-T0)/DAY);
const fmt=s=>{if(!s)return'—';const[a,b,c]=s.split('-');return`${c}.${b}`};
const fmtY=s=>{if(!s)return'—';const[a,b,c]=s.split('-');return`${c}.${b}.${a}`};
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('ru-RU')+' ₸';
const uid=p=>p+Math.random().toString(36).slice(2,7);

const DEPTS=['ОГЭ','Механическая служба','ОМТС','Склад','HR','БиОТ','ОТК','Производство','СГП','Технический блок'];
const TST=['Новая','Диагностика','Согласована','Ждет решения','Ждет оплаты','В закупе','На складе','В работе','На проверке','Выполнено'];
const EST=['В норме','Наблюдение','Диагностика','Ожидает решения','В ремонте','Ожидает запчасть','ППР запланирован','Выведен из работы'];
const ESTC={'В норме':'ok','Наблюдение':'warn','Диагностика':'warn','Ожидает решения':'warn','В ремонте':'crit','Ожидает запчасть':'crit','ППР запланирован':'info','Выведен из работы':''};
const CHAIN=['Механик','ОМТС','Финансы','Оплата','Склад','Выдача','Ремонт','Закрытие'];
const EVT=['Авария','Ремонт','Решение','Осмотр','Закупка','Проверка','Производство','Задача'];

// ---------- seed ----------
function seed(){
const people=[
 {id:'p1',name:'Ерлан Сапаров',role:'Директор',dept:'Руководство',rep:100,rpt:0},
 {id:'p2',name:'Асхат Нурланов',role:'Технический директор',dept:'Технический блок',rep:96,rpt:0},
 {id:'p3',name:'Бауыржан Тлеуов',role:'Главный механик',dept:'Механическая служба',rep:92,rpt:1},
 {id:'p4',name:'Данияр Абенов',role:'Механик',dept:'Механическая служба',rep:78,rpt:2},
 {id:'p5',name:'Сергей Ким',role:'Главный энергетик',dept:'ОГЭ',rep:95,rpt:0},
 {id:'p6',name:'Нурлан Жумабеков',role:'Электромонтёр',dept:'ОГЭ',rep:84,rpt:1},
 {id:'p7',name:'Айгерим Сеитова',role:'Начальник ОМТС',dept:'ОМТС',rep:90,rpt:0},
 {id:'p8',name:'Гульнара Ахметова',role:'Финансист',dept:'Финансы',rep:88,rpt:0},
 {id:'p9',name:'Марат Исаев',role:'Кладовщик',dept:'Склад',rep:70,rpt:1},
 {id:'p10',name:'Жанна Оспанова',role:'Инженер БиОТ',dept:'БиОТ',rep:97,rpt:0},
 {id:'p11',name:'Руслан Бекжанов',role:'Начальник ОТК',dept:'ОТК',rep:93,rpt:0},
 {id:'p12',name:'Олжас Мухтаров',role:'Начальник смены',dept:'Производство',rep:91,rpt:0},
 {id:'p13',name:'Динара Касымова',role:'HR-менеджер',dept:'HR',rep:94,rpt:0},
 {id:'p14',name:'Ербол Садыков',role:'Мастер СГП',dept:'СГП',rep:89,rpt:0}];
const t=(id,title,dept,owner,status,due,prio,o={})=>({id,title,dept,owner,status,due,prio,eq:o.eq||'',blocker:o.b||'',decision:!!o.dec,doneAt:o.done||'',created:o.c||d(-7)});
const tasks=[
 t('T-118','Замена подшипников щековой дробилки ДР-1','Механическая служба','p4','На складе',d(-1),'Критично',{eq:'E4'}),
 t('T-121','Диагностика печного трансформатора ТП-2: хроматография масла','ОГЭ','p5','Диагностика',d(2),'Критично',{eq:'E3'}),
 t('T-122','Ремонт механизма передвижения моста МК-3','Механическая служба','p3','В работе',d(0),'Высокий',{eq:'E5'}),
 t('T-109','Замена рукавов газоочистки ГО-1','Технический блок','p2','Ждет решения',d(-2),'Критично',{eq:'E7',b:'Нужно решение директора: менять все 48 рукавов (3,2 млн ₸) или поэтапно по 16',dec:true}),

 const doneRate=done.length/ts.length,onT=done.length?ontime/done.length:1,lateS=1-late/ts.length,kzS=Math.min(kz/2,1),pprS=pp.length?ppd/pp.length:1,rep=(p.rep||80)/100;
 let sc=100*(.25*doneRate+.2*onT+.2*lateS+.1*kzS+.15*pprS+.1*rep)-p.rpt*4;sc=Math.max(0,Math.round(sc));
 return{p,total:ts.length,done:done.length,ontime,late,kz,ppr:pp.length?`${ppd}/${pp.length}`:'—',rep:p.rep,rpt:p.rpt,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc)}

function w5draft(e){const fs=e.failures;if(!fs.length)return null;const last=fs[fs.length-1];const same=fs.filter(f=>f.cause===last.cause).length;
 return{eq:e.id,problem:`${last.text} (${e.code})`,whys:[last.text,last.cause,same>1?`Отказ повторялся ${same} раза — причина не устранялась`:'Узел не контролировался между ремонтами','После ремонтов не проводился анализ корневой причины','В чек-листе ППР нет пункта контроля этого узла'],root:'В чек-листе ППР нет пункта контроля узла, причина отказа не устраняется',action:`Добавить контроль узла в чек-лист ППР ${e.code}, устранить причину: ${last.cause.toLowerCase()}`}}

 let m=q.match(/создай задачу[:\s]+(.+)/i);
 if(m){const t={id:'T-'+(130+S.tasks.length),title:m[1].trim(),dept:e?.dept||'Технический блок',owner:e?.resp||'p2',status:'Новая',due:d(2),prio:'Обычный',eq:e?.id||'',blocker:'',decision:false,doneAt:'',created:d(0)};S.tasks.push(t);log('Задача','Технический блок',`Создана задача ${t.id}: ${t.title}`,'p1',t.eq);save();
  return `Создал задачу <b>${t.id}</b> «${h(t.title)}». Исполнитель: ${h(P(t.owner).name)}, срок ${fmt(t.due)}, статус «Новая». <button class="link" ${go('kanban')}>Открыть канбан</button>`}
 if(/5 ?why|почему/.test(s)&&e){const w=w5draft(e);if(!w)return `По ${e.code} отказов не зафиксировано.`;ui.w5=w;
  return `Черновик 5 Why по <b>${e.code}</b>:<ol>${w.whys.map(x=>`<li>${h(x)}</li>`).join('')}</ol><b>Корневая причина:</b> ${h(w.root)}<br><b>Действие:</b> ${h(w.action)}<br><button class="link" data-a="gotqm">Открыть в TQM для проверки и сохранения</button>`}
 if(/(отвеча|ответствен)/.test(s)&&e)return `За <b>${e.code}</b> ${h(e.name)} отвечает ${h(P(e.resp).name)}, ${h(P(e.resp).role)}. Статус: ${h(e.status)}.`;
 if(/повтор/.test(s))return `Повторяющиеся неисправности за 90 дней:${ul(recurring().map(r=>`<b>${r.eq.code}</b> — ${h(r.cause)}: ${r.n} раза, последний ${fmt(r.last)}`))}Рекомендую провести 5 Why по каждой и оформить CAPA.`;
 if(/ппр/.test(s))return `ППР на ближайшие 7 дней и просроченные:${ul(S.ppr.filter(p=>!p.done&&diff(p.date)<=7).sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`${eqCode(p.eq)} ${p.type} — ${fmt(p.date)}, ${short(p.resp)} (${pprState(p)[0].toLowerCase()})`))}`;
 if(/закуп|заявк|застрял/.test(s))return `Закупки в работе:${ul(S.purchases.filter(p=>p.stage<7).map(p=>`${p.id} ${h(p.item)} — этап «${CHAIN[p.stage]}»${p.delay?`, задержка: ${h(p.delay)}`:''}${diff(p.due)<0?' <span class="late">срок прошёл</span>':''}`))}`;
 if(/просроч/.test(s))return `Просроченные задачи:${ul(S.tasks.filter(isLate).map(t=>`${t.id} ${h(t.title)} — ${short(t.owner)}, срок ${fmt(t.due)}`))}`;
 if(/эффектив|kpi|лучш/.test(s))return `Рейтинг по KPI:${ul(kpi().slice(0,5).map(x=>`${h(x.p.name)} (${h(x.p.role)}) — ${x.sc}`))}`;
 if(/отч[её]т/.test(s)){const dec=S.tasks.filter(t=>open(t)&&t.decision);return `<b>Отчёт директору на ${fmtY(d(0))}</b><br>Требуют решения:${ul(dec.map(t=>`${h(t.title)}: ${h(t.blocker)}`))}Аварии за 3 дня:${ul(S.events.filter(x=>x.type==='Авария'&&diff(x.date)>=-3).map(x=>h(x.text)))}Просрочено задач: ${S.tasks.filter(isLate).length}. Оборудование не в норме: ${S.equipment.filter(x=>x.status!=='В норме').length} из ${S.equipment.length}.`}
 if(/происходит|сейчас|обстановк|сводк/.test(s)){const att=S.equipment.filter(x=>!['В норме','ППР запланирован'].includes(x.status));return `Сейчас на предприятии:${ul([`Оборудование требует внимания: ${att.map(x=>x.code+' ('+x.status.toLowerCase()+')').join(', ')}`,`Просрочено задач: ${S.tasks.filter(isLate).length}, ждут решения руководства: ${S.tasks.filter(t=>open(t)&&t.decision).length}`,`Последнее событие: ${h(S.events[0].text)}`,`Закупок в работе: ${S.purchases.filter(p=>p.stage<7).length}`])}`}
 if(e){const ts=S.tasks.filter(t=>t.eq===e.id&&open(t));return `<b>${e.code}</b> ${h(e.name)} — ${h(e.status)}, ответственный ${h(P(e.resp).name)}.${e.failures.length?' Последний отказ: '+h(e.failures[e.failures.length-1].text)+' ('+fmt(e.failures[e.failures.length-1].date)+').':''}${ts.length?' Открытые задачи:'+ul(ts.map(t=>h(t.title)+' — '+h(t.status))):''} <button class="link" data-a="eq" data-id="${e.id}">Карточка</button>`}
 const words=s.replace(/[^\p{L}\p{N}\s-]/gu,' ').split(/\s+/).filter(w=>w.length>3).map(w=>w.slice(0,Math.max(4,w.length-2)));
 const hits=[];Object.entries(S.kb).forEach(([dp,a])=>a.forEach(x=>{const t=(x.title+' '+x.text).toLowerCase();const sc=words.filter(w=>t.includes(w)).length;if(sc)hits.push({sc,html:`<b>${h(x.title)}</b> <span class="muted">(${h(dp)}, ${h(x.type)})</span><br>${h(x.text.slice(0,260))}${x.text.length>260?'…':''}`})}));

 hits.sort((a,b)=>b.sc-a.sc);
 return hits.length?`Нашёл в базе знаний и журнале:${ul(hits.slice(0,3).map(x=>x.html))}`:'Не нашёл ответа в данных платформы. Уточните вопрос или укажите код оборудования, например КЛ-4.'}

 <p class="note">Состав построен по данным с сайта kazferrogroup.kz и публикаций о заводе: цех №1 с первой печью 1,8 МВт (2011, трансформатор усилен в 2021 году) и печью №3 для высокомарочного ферромарганца ФМн88-95, цех №2 с печью РКО 3,6 МВт, выпуск металла каждые 2 часа, продукция ФМн78, MnSi17/18, ферросилиций, ферротитан, феррохром, шлак; марганцевая руда с собственного месторождения у Балхаша. Расположение корпусов, шихтового двора, газоочистки и вспомогательных объектов схематичное: генплана в открытом доступе нет. Точка на карте: 42.2715, 69.6873 (2ГИС). Статусы и отказы берутся из платформы в реальном времени: кран, конвейер и газоочистка останавливаются при статусах «В ремонте», «Ожидает запчасть» или «Выведен из работы».</p>`}

// ---------- render ----------
const V={model3d:vModel3d,twin:vTwin,reports:vReports,kanban:vKanban,equipment:vEquipment,purchases:vPurchases,ppr:vPPR,tqm:vTQM,kb:vKB,journal:vJournal,kpi:vKPI,ai:vAI,integr:vIntegr};
function render(){
 const badge={kanban:S.tasks.filter(isLate).length,ppr:S.ppr.filter(p=>!p.done&&diff(p.date)<0).length,reports:S.tasks.filter(t=>open(t)&&t.decision).length};
 document.getElementById('nav').innerHTML=VIEWS.map(([g,a])=>`<div class="navgroup"><span>${g}</span>${a.map(([k,n])=>`<button class="navbtn ${ui.view===k?'on':''}" ${go(k)}><span>${n}</span>${badge[k]?`<span class="badge">${badge[k]}</span>`:''}</button>`).join('')}</div>`).join('');
 document.getElementById('main').innerHTML=V[ui.view]();
 const dr=document.getElementById('drawer');
 if(ui.drawer){const e=EQ(ui.drawer);dr.innerHTML=e?`<div class="ov" data-a="ovclose"><div class="drawer" role="dialog" aria-label="${h(e.name)}">${drawerEq(e)}</div></div>`:'';}else dr.innerHTML='';
 document.getElementById('clock').textContent='Сегодня '+fmtY(d(0));
 if(ui.view==='model3d')mount3d();
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(G)theme3d()})}catch(e){}
try{new MutationObserver(()=>{if(G)theme3d()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}

// ---------- events ----------
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 if(a==='ovclose'&&ev.target!==el)return;
 switch(a){
  case 'go':ui.view=el.dataset.v;ui.drawer=null;try{history.replaceState(null,'','#'+ui.view)}catch(e){}window.scrollTo(0,0);break;
  case 'set':{const k=el.dataset.k;let v=el.dataset.v;if(['newTask','fBlock'].includes(k))v=!!v;ui[k]=v;if(k==='kbDept')ui.kbq='';if(k==='pprShift')ui.pprErr='';break}
  case 'eq':ui.drawer=id;break;
  case 'close':case 'ovclose':ui.drawer=null;break;
  case 'reset':S=seed();save();ui.chat=[];toast('Демо-данные восстановлены');break;
  case 'advance':{const p=S.purchases.find(x=>x.id===id);if(p.stage<7){p.stage++;p.hist.push({date:d(0),stage:CHAIN[p.stage],note:'Передано на этап «'+CHAIN[p.stage]+'»'+(p.delay?'. Задержка была: '+p.delay:'')});p.delay='';log('Закупка','ОМТС',`${p.id} ${p.item}: этап «${CHAIN[p.stage]}»`,'p7',p.eq);toast(`${p.id} → ${CHAIN[p.stage]}`)}break}
  case 'pprdone':{const p=S.ppr.find(x=>x.id===id);p.done=true;p.doneAt=d(0);const nx=new Date(T0.getTime()+p.period*DAY);S.ppr.push({id:'П-'+(310+S.ppr.length),eq:p.eq,type:p.type,date:ds(nx),resp:p.resp,period:p.period,done:false,doneAt:'',shifts:[]});log('Ремонт',EQ(p.eq).dept,`Выполнен ППР ${p.type} ${eqCode(p.eq)}`,p.resp,p.eq);toast(`ППР выполнен, следующий ${fmt(ds(nx))}`);break}
  case 'decide':{const t=S.tasks.find(x=>x.id===id);t.decision=false;t.status='Согласована';const b=t.blocker;t.blocker='';log('Решение','Руководство',`Решение по ${t.id}: ${b} — согласовано директором`,'p1',t.eq);toast('Решение зафиксировано в журнале');break}
  case 'vote':S.kaizen.find(x=>x.id===id).votes++;break;
  case 'ask':ask(el.dataset.v);return;
  case 'w5ai':{const sel=document.getElementById('w-eq');const e=EQ(sel.value);const w=w5draft(e);if(!w){toast('По этому оборудованию отказов нет');return}ui.w5=w;break}
  case 'gotqm':ui.view='tqm';ui.tqm='5why';break;
  case 'sel3d':sel3d(id);return;
  case 'lbl3d':ui.lbl3d=!ui.lbl3d;el.classList.toggle('on',ui.lbl3d);return;
  case 'reset3d':if(G){G.goal=new THREE.Vector3(0,0,0);G.radGoal=200;G.st.phi=.9}sel3d(null);return;
  default:return}
 save();render()});
document.addEventListener('change',ev=>{const el=ev.target,c=el.dataset.c;if(!c)return;const id=el.dataset.id;
 if(c==='fDept'||c==='fOwner')ui[c]=el.value;
 else if(c==='tstatus')setStatus(id,el.value);
 else if(c==='eqstatus'){const e=EQ(id);const old=e.status;e.status=el.value;log('Осмотр',e.dept,`${e.code}: статус «${old}» → «${e.status}»`,e.resp,e.id);toast('Статус обновлён')}
 else if(c==='delay'){S.purchases.find(x=>x.id===id).delay=el.value;save();toast('Причина задержки сохранена');return}
 else if(c==='capa')S.capa.find(x=>x.id===id).status=el.value;
 else if(c==='kzstatus')S.kaizen.find(x=>x.id===id).status=el.value;
 else if(c==='s5')S.s5[+el.dataset.i].sc[+el.dataset.j]=+el.value;
 save();render()});
document.addEventListener('input',ev=>{if(ev.target.dataset.i==='kbq'){ui.kbq=ev.target.value;document.getElementById('kblist').innerHTML=kbList()}});
function setStatus(id,st){const t=S.tasks.find(x=>x.id===id);if(!t||t.status===st)return;const old=t.status;t.status=st;t.doneAt=st==='Выполнено'?d(0):'';if(st==='Выполнено'){t.blocker='';t.decision=false}log('Задача',t.dept,`${t.id}: «${old}» → «${st}»`,t.owner,t.eq);toast(`${t.id}: ${st}`)}
document.addEventListener('submit',ev=>{const f=ev.target,k=f.dataset.f;if(!k)return;ev.preventDefault();const D=Object.fromEntries(new FormData(f));const id=f.dataset.id;
 switch(k){
  case 'task':{const t={id:'T-'+(130+S.tasks.length),title:D.title,dept:D.dept,owner:D.owner,status:'Новая',due:D.due||d(3),prio:D.prio,eq:D.eq,blocker:D.blocker||'',decision:false,doneAt:'',created:d(0)};S.tasks.push(t);log('Задача',t.dept,`Создана задача ${t.id}: ${t.title}`,t.owner,t.eq);ui.newTask=false;toast('Задача создана');break}
  case 'fail':{const e=EQ(id);e.failures.push({date:d(0),text:D.text,cause:D.cause||'Устанавливается'});log('Авария',e.dept,`${e.code}: ${D.text}`,e.resp,e.id);if(e.status==='В норме')e.status='Диагностика';toast('Поломка зафиксирована');break}
  case 'insp':{const e=EQ(id);const ok=e.checklist.filter((_,i)=>D['c'+i]).length;e.inspections.push({date:d(0),who:e.resp,ok,total:e.checklist.length,note:D.note||''});log('Осмотр',e.dept,`Осмотр ${e.code}: ${ok}/${e.checklist.length} пунктов в норме${D.note?'. '+D.note:''}`,e.resp,e.id);toast('Осмотр записан');break}
  case 'shift':{if(!D.reason.trim()){ui.pprErr='Укажите причину переноса — без неё перенос не сохраняется.';break}const p=S.ppr.find(x=>x.id===id);p.shifts.push({from:p.date,to:D.to,reason:D.reason});log('Решение','Технический блок',`Перенос ППР ${eqCode(p.eq)} ${p.type}: ${fmt(p.date)} → ${fmt(D.to)}. Причина: ${D.reason}`,p.resp,p.eq);p.date=D.to;ui.pprShift=null;ui.pprErr='';toast('ППР перенесён');break}
  case 'why5':{const w={id:'W-'+(13+S.why5.length-1),eq:D.eq,problem:D.problem,whys:[0,1,2,3,4].map(i=>D['w'+i]).filter(Boolean),root:D.root,action:D.action,date:d(0)};S.why5.unshift(w);if(D.action)S.capa.unshift({id:'CAPA-'+(23+S.capa.length),src:w.id,type:'Корректирующее',action:D.action,resp:EQ(D.eq).resp,due:d(14),status:'Открыто'});log('Решение',EQ(D.eq).dept,`5 Why ${w.id}: ${D.problem}. Корень: ${D.root}`,EQ(D.eq).resp,D.eq);ui.w5=null;toast('Анализ сохранён, CAPA создано');break}
  case 'kaizen':S.kaizen.unshift({id:'K-'+(46+S.kaizen.length),author:D.author,title:D.title,effect:D.effect||'',status:'Подано',votes:0,date:d(0)});toast('Предложение подано');break;
  case 'kb':(S.kb[ui.kbDept]=S.kb[ui.kbDept]||[]).unshift({id:uid('kb'),type:D.type,title:D.title,text:D.text||'',updated:d(0)});toast('Документ добавлен');break;
  case 'event':S.events.unshift({id:uid('ev'),date:d(0),type:D.type,dept:D.dept,text:D.text,who:'p1',eq:D.eq});toast('Событие записано');break;
  case 'goal':{const g=S.goals[ui.person]=S.goals[ui.person]||{year:[],month:[],week:[]};g[D.hz].push(D.text);toast('Цель добавлена');break}
  case 'ai':ask(D.q);return}
 save();render()});
// drag & drop
document.addEventListener('dragstart',ev=>{const c=ev.target.closest('[data-drag]');if(c){ev.dataTransfer.setData('text/plain',c.dataset.drag);ev.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',ev=>{const c=ev.target.closest('[data-col]');if(c){ev.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',ev=>{const c=ev.target.closest('[data-col]');if(!c)return;ev.preventDefault();setStatus(ev.dataTransfer.getData('text/plain'),c.dataset.col);save();render()});
document.addEventListener('dragend',()=>document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over')));
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.drawer){ui.drawer=null;render()}});

const hv=(location.hash||'').slice(1);if(V[hv])ui.view=hv;
render();
</script>
